<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-6">
    
    <!-- Breadcrumb with page title -->
    <app-breadcrumb 
      [items]="breadcrumbItems" 
      [pageTitle]="'النتائج'">
    </app-breadcrumb>

    <!-- Main Exam Results Card -->
    <div class="mx-auto bg-white rounded-lg shadow-sm p-8">
      <div class="border-b border-gray-200 mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">نتائج الإمتحانات</h1>
      </div>
      
      <!-- Exam Results Table -->
      <app-table
        [data]="examResults"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalRecords]="totalRecords"
        [lazy]="false"
        [loading]="isLoadingResults"
        [showSearch]="false"
        [showExport]="true"
        [showShare]="false"
        [pageSize]="10"
        [showHeader]="true"
        (export)="exportResults()"
      ></app-table>
    </div>
  </div>
</div>
