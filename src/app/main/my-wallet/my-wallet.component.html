<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-6">
    
    <!-- Breadcrumb with page title -->
    <app-breadcrumb 
      [items]="breadcrumbItems" 
      [pageTitle]="'المحفظة'">
    </app-breadcrumb>

    <!-- Main Wallet Card containing everything -->
    <div class="  mx-auto bg-white rounded-lg shadow-sm p-8">

          <div class="border-b border-gray-200">
                      <h1 class="text-2xl font-bold text-gray-800 mb-4">محفظتي</h1>

        </div>

      <!-- Wallet Charging Section -->
      <div class="px-8 py-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-8 text-center">اشحن محفظتك ( فوري )</h2>
        
        <form [formGroup]="chargeForm" (ngSubmit)="onCharge()" class="max-w-md mx-auto">
          <!-- Amount Input -->
          <div class="mb-6">
            <label for="amount" class="block text-sm font-medium text-gray-700 mb-3 text-right">
              المبلغ
            </label>
            <div class="relative">
              <input 
                pInputText 
                id="amount"
                formControlName="amount"
                placeholder="أدخل المبلغ اللي تريد شحنة"
                class="wallet-input w-full text-right pr-12 text-lg"
              />
              <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 text-sm font-medium">
                جم
              </span>
            </div>
            <small class="text-red-500 text-right block text-xs mt-2" *ngIf="isFieldInvalid('amount')">
              {{ getFieldError('amount') }}
            </small>
          </div>

          <!-- Charge Button -->
          <button 
            pButton 
            type="submit"
            label="شحن"
            class="wallet-charge-btn w-full text-white font-semibold py-4 text-lg rounded-xl mb-8"
            [disabled]="chargeForm.invalid || isCharging"
            [loading]="isCharging"
          ></button>
        </form>

        <!-- Divider -->
        <div class="flex items-center my-8">
          <div class="flex-1 border-t border-gray-300"></div>
          <span class="px-6 text-gray-500 text-lg font-medium">أو</span>
          <div class="flex-1 border-t border-gray-300"></div>
        </div>

        <!-- QR Code Charge -->
        <div class="text-center mb-8">
          <button 
            pButton 
            icon="pi pi-qrcode"
            label="شحن كود جديد"
            class="wallet-code-btn font-medium py-3 px-8 rounded-xl"
            routerLink="/code-recharge"
          ></button>
        </div>
      </div>

      <!-- Transaction History Table - seamlessly integrated -->
      <app-table
        [data]="transactions"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalRecords]="totalRecords"
        [lazy]="false"
        [loading]="isLoadingTransactions"
        [showSearch]="true"
        [showExport]="true"
        [showShare]="false"
        [pageSize]="10"
        [showHeader]="true"
        (export)="exportTransactions()"
        (search)="searchTransactions($event)"
      ></app-table>
    </div>
  </div>
</div>
