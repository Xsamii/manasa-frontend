<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4" dir="rtl">
      <div class="max-w-md w-full text-center">
        
        <!-- 404 Illustration -->
        <div class="mb-8">
          <div class="text-6xl font-bold text-gray-300 mb-4">404</div>
          <div class="w-32 h-32 bg-gray-200 rounded-full flex items-center justify-center mx-auto">
            <i class="pi pi-exclamation-triangle text-4xl text-gray-400"></i>
          </div>
        </div>

        <!-- Error Message -->
        <h1 class="text-2xl font-bold text-gray-800 mb-4">الصفحة غير موجودة</h1>
        <p class="text-gray-600 mb-8">
          عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها إلى موقع آخر.
        </p>

        <!-- Action Buttons -->
        <div class="space-y-3">
          <button 
            pButton 
            label="العودة للرئيسية"
            class="w-full p-button-warning"
            routerLink="/"
          ></button>
          
          <button 
            pButton 
            label="الرجوع للخلف"
            class="w-full p-button-outlined"
            (click)="goBack()"
          ></button>
        </div>

        <!-- Help Links -->
        <div class="mt-8 pt-8 border-t border-gray-200">
          <p class="text-sm text-gray-500 mb-4">هل تحتاج للمساعدة؟</p>
          <div class="flex justify-center space-x-4 space-x-reverse">
            <a href="#" class="text-orange-600 hover:text-orange-500 text-sm">الدعم الفني</a>
            <a href="#" class="text-orange-600 hover:text-orange-500 text-sm">الأسئلة الشائعة</a>
            <a href="#" class="text-orange-600 hover:text-orange-500 text-sm">تواصل معنا</a>
          </div>
        </div>
      </div>
    </div>
