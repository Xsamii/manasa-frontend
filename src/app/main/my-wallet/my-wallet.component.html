<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-6">
    
    <!-- Breadcrumb with page title -->
    <app-breadcrumb 
      [items]="breadcrumbItems" 
      [pageTitle]="'المحفظة'">
    </app-breadcrumb>

    <!-- Main Wallet Card containing everything -->
    <div class="  mx-auto bg-white rounded-lg shadow-sm p-8">

          <div class="border-b border-gray-200">
                      <h1 class="text-2xl font-bold text-gray-800 mb-4">محفظتي</h1>

        </div>

      <div class="px-8 py-8">
        <div class="max-w-md mx-auto text-center rounded-xl bg-orange-50 p-6 mb-6">
          <p class="text-gray-600">الرصيد المتاح</p>
          <strong class="text-3xl text-orange-600">{{ balance }} {{ currency }}</strong>
        </div>
        <p *ngIf="errorMessage" class="text-center text-red-600 mb-4" role="alert">{{ errorMessage }}</p>
        <div class="text-center mb-8">
          <button 
            pButton 
            icon="pi pi-qrcode"
            label="شحن باستخدام كود"
            class="wallet-code-btn font-medium py-3 px-8 rounded-xl"
            routerLink="/code-recharge"
          ></button>
        </div>
      </div>

      <!-- Transaction History Table - seamlessly integrated -->
      <app-table
        [data]="transactions"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalRecords]="totalRecords"
        [lazy]="false"
        [loading]="isLoadingTransactions"
        [showSearch]="true"
        [showExport]="true"
        [showShare]="false"
        [pageSize]="10"
        [showHeader]="true"
        (export)="exportTransactions()"
        (search)="searchTransactions($event)"
      ></app-table>
    </div>
  </div>
</div>
