<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-6">
    
    <!-- Breadcrumb with page title -->
    <app-breadcrumb 
      [items]="breadcrumbItems" 
      [pageTitle]="'اشتراكاتي'">
    </app-breadcrumb>

    <!-- Main Subscriptions Card -->
    <div class="mx-auto bg-white rounded-lg shadow-sm p-8">
      <div class="border-b border-gray-200 mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">الإشتراكات</h1>
      </div>
      <p *ngIf="errorMessage" class="text-center text-red-600 py-4" role="alert">{{ errorMessage }}</p>
      <p *ngIf="!isLoadingSubscriptions && !errorMessage && !subscriptions.length"
         class="text-center text-gray-500 py-8">لا توجد اشتراكات بعد.</p>
      
      <!-- Subscriptions Table -->
      <app-table
        [data]="subscriptions"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalRecords]="totalRecords"
        [lazy]="false"
        [loading]="isLoadingSubscriptions"
        [showSearch]="true"
        [showExport]="true"
        [showShare]="true"
        [pageSize]="10"
        [showHeader]="true"
        (export)="exportSubscriptions()"
        (search)="searchSubscriptions($event)"
        (shareData)="shareSubscriptions()"
      ></app-table>
    </div>
  </div>
</div>
