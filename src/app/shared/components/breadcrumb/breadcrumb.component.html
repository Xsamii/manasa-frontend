<div class="breadcrumb-card">
  <!-- Page Title -->
  <h1 *ngIf="pageTitle" class="page-title">{{ pageTitle }}</h1>
  
  <!-- Breadcrumb Navigation -->
  <nav class="breadcrumb-nav" aria-label="Breadcrumb">
    <ol class="breadcrumb-list">
      <li class="breadcrumb-item">
        <a routerLink="/dashboard" class="breadcrumb-link">
          الرئيسية
        </a>
      </li>
      <li *ngFor="let item of items; let last = last" class="breadcrumb-item">
        <div class="breadcrumb-content">
          <i class="pi pi-angle-left breadcrumb-separator"></i>
          <a 
            *ngIf="item.routerLink && !last" 
            [routerLink]="item.routerLink"
            class="breadcrumb-link"
          >
            {{ item.label }}
          </a>
          <span 
            *ngIf="!item.routerLink || last"
            class="breadcrumb-current"
            aria-current="page"
          >
            {{ item.label }}
          </span>
        </div>
      </li>
    </ol>
  </nav>
</div>
