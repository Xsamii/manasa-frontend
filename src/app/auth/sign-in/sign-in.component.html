 <div class="min-h-screen bg-gray-50 flex" dir="rtl">
      <!-- Right Section - Form -->
      <div class="w-full lg:w-1/3 bg-white flex flex-col">
        <!-- Logo Section -->
        <div class="p-4 lg:p-6 text-center border-b border-gray-200">
          <div class="flex items-center justify-center mb-4">
            <img src="assets/icons/logo.svg" alt="Logo" class="w-full h-16 lg:h-24 ml-2 rounded-full">
          </div>
        </div>

        <!-- Login Form Section -->
        <div class="flex-1 overflow-y-auto p-4 lg:p-6">
          <div class="mb-4 lg:mb-6">
            <h2 class="text-lg lg:text-xl font-semibold text-gray-800 mb-2">تسجيل دخول</h2>
            <p class="text-xs lg:text-sm text-gray-600">
              أدخل بياناتك للوصول إلى حسابك
            </p>
          </div>

          <!-- Error Message -->
          <p-message 
            *ngIf="errorMessage" 
            severity="error" 
            [text]="errorMessage"
            styleClass="mb-4"
          ></p-message>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
            
            <!-- Email -->
            <div class="form-field">
              <label for="email" class="block text-sm font-medium text-gray-700 mb-2 text-right">
                البريد الإلكتروني
              </label>
              <input 
                pInputText 
                id="email"
                formControlName="email"
                placeholder="أدخل بريدك الإلكتروني"
                class="w-full text-right border border-gray-300 rounded-md p-2 text-sm lg:text-base"
                [class.ng-invalid]="isFieldInvalid('email')"
              />
              <small class="text-red-500 text-right block text-xs" *ngIf="isFieldInvalid('email')">
                {{ getFieldError('email') }}
              </small>
            </div>

            <!-- Password -->
            <div class="form-field">
              <label for="password" class="block text-sm font-medium text-gray-700 mb-2 text-right">
                كلمة المرور
              </label>
              <p-password 
                formControlName="password"
                placeholder="أدخل كلمة المرور"
                styleClass="w-full"
                inputStyleClass="w-full text-right border border-gray-300 rounded-md p-2 text-sm lg:text-base"
                [class.ng-invalid]="isFieldInvalid('password')"
                [feedback]="false"
                [toggleMask]="true"
              ></p-password>
              <small class="text-red-500 text-right block text-xs" *ngIf="isFieldInvalid('password')">
                {{ getFieldError('password') }}
              </small>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex justify-between items-center">
              <div class="flex items-center">
                <p-checkbox 
                  formControlName="rememberMe"
                  binary="true"
                  inputId="rememberMe"
                ></p-checkbox>
                <label for="rememberMe" class="mr-2 text-sm text-gray-600">تذكرني</label>
              </div>
              <a routerLink="/auth/forgot-password" class="text-sm text-orange-600 hover:text-orange-500">
                نسيت كلمة المرور؟
              </a>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
              <button 
                pButton 
                type="submit"
                label="تسجيل دخول"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 lg:py-3 px-4 rounded-lg font-medium transition-colors text-sm lg:text-base"
                [disabled]="loginForm.invalid || isLoading"
                [loading]="isLoading"
              ></button>
            </div>

            <!-- Sign Up Link -->
            <div class="text-center pt-4">
              <p class="text-sm text-gray-600">
                ليس لديك حساب؟ 
                <a routerLink="/auth/sign-up" class="text-orange-600 hover:text-orange-500 font-medium">
                  إنشاء حساب جديد
                </a>
              </p>
            </div>
          </form>
        </div>
      </div>

      <!-- Left Section - Image -->
      <div class="hidden lg:block lg:w-2/3 relative overflow-hidden">
        <div class="absolute inset-0 flex items-center justify-center">
          <img src="assets/images/signin.png" alt="" class="w-full h-full object-cover">
        </div>
      </div>
    </div>
