<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-6">
    
    <!-- Breadcrumb with page title -->
    <app-breadcrumb 
      [items]="breadcrumbItems" 
      [pageTitle]="'الكورسات'">
    </app-breadcrumb>

    <!-- Main Courses Card -->
    <div class="mx-auto bg-white rounded-lg shadow-sm p-8">
      <div class="border-b border-gray-200 mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">كورساتي</h1>
      </div>
      
      <!-- Filter Tabs -->
      <div class="filter-section mb-8">
        <h2 class="filter-title">نوع الإشتراك اللذي تريد عرضه</h2>
        <div class="filter-tabs">
          <button 
            *ngFor="let filter of filterOptions"
            class="filter-tab"
            [class.active]="selectedFilter === filter.value"
            (click)="setFilter(filter.value)"
          >
            {{ filter.label }}
          </button>
        </div>
      </div>

      <!-- Courses Grid -->
      <div class="courses-grid" *ngIf="!isLoading">
        <div 
          *ngFor="let course of filteredCourses"
          class="course-card"
        >
          <!-- Course Image -->
          <div class="course-image">
            <img [src]="course.image" [alt]="course.title" />
            <div class="course-overlay">
              <span class="course-badge" [ngClass]="getCourseTypeClass(course.type)">
                {{ course.type }}
              </span>
            </div>
          </div>

          <!-- Course Content -->
          <div class="course-content">
            <div class="course-meta">
              <span class="course-date">{{ course.date }}</span>
              <span class="course-subject">{{ course.subject }}</span>
            </div>
            
            <h3 class="course-title">{{ course.title }}</h3>
            <p class="course-instructor">{{ course.instructor }}</p>
            
            <button 
              class="course-access-btn"
              (click)="accessCourse(course)"
            >
              الدخول للكورس
            </button>
          </div>
        </div>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-grid">
        <div *ngFor="let item of [1,2,3,4,5]" class="course-skeleton">
          <div class="skeleton-image"></div>
          <div class="skeleton-content">
            <div class="skeleton-line skeleton-line-short"></div>
            <div class="skeleton-line skeleton-line-long"></div>
            <div class="skeleton-line skeleton-line-medium"></div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="!isLoading && filteredCourses.length === 0" class="empty-state">
        <i class="pi pi-book empty-icon"></i>
        <h3 class="empty-title">لا توجد كورسات متاحة</h3>
        <p class="empty-description">لا يوجد كورسات في هذا التصنيف حالياً</p>
      </div>

      <!-- Load More Button -->
      <div *ngIf="hasMoreCourses && !isLoading" class="load-more-section">
        <button 
          class="load-more-btn"
          (click)="loadMoreCourses()"
        >
          المزيد
        </button>
      </div>
    </div>
  </div>
</div>
