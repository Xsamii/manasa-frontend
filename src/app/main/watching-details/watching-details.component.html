<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-6">
    
    <!-- Breadcrumb with page title -->
    <app-breadcrumb 
      [items]="breadcrumbItems" 
      [pageTitle]="'المشاهدات'">
    </app-breadcrumb>

    <!-- Main Watching Details Card -->
    <div class="mx-auto bg-white rounded-lg shadow-sm p-8">
      <div class="border-b border-gray-200 mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">تفاصيل المشاهدات</h1>
      </div>
      
      <!-- Watching Details Table -->
      <app-table
        [data]="watchingDetails"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalRecords]="totalRecords"
        [lazy]="false"
        [loading]="isLoadingWatchingDetails"
        [showSearch]="true"
        [showExport]="true"
        [showShare]="true"
        [pageSize]="10"
        [showHeader]="true"
        (export)="exportWatchingDetails()"
        (search)="searchWatchingDetails($event)"
        (shareData)="shareWatchingDetails()"
      ></app-table>
    </div>
  </div>
</div>
